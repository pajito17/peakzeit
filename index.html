<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>peakZeit · Jarvis</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0B0B0F;--y:#FFE600;--r:#FF2D55;--c:#5CE1FF;--g:#7DFFB0;--t:#fff;--m:#a39cab;--glass:rgba(26,22,34,.62)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--t);font-family:-apple-system,"SF Pro Display","Segoe UI",Inter,sans-serif;overflow-x:hidden}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.wrap{position:relative;z-index:1;padding:18px 16px calc(28px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
/* Kopf mit Reaktor */
.hero{position:relative;height:300px;display:flex;align-items:center;justify-content:center;perspective:700px}
.core{position:absolute;width:250px;height:250px;transform-style:preserve-3d;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotateX(8deg)}}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(92,225,255,.55)}
.ring.r1{border-style:dashed;animation:spin 18s linear infinite}
.ring.r2{inset:30px;border-color:rgba(255,45,85,.6);animation:spin 11s linear infinite reverse}
.ring.r3{inset:58px;border:6px solid transparent;border-top-color:var(--y);border-right-color:rgba(255,230,0,.25);animation:spin 3.2s linear infinite;filter:drop-shadow(0 0 10px var(--y))}
.ring.r4{inset:-14px;border-color:rgba(255,230,0,.18);border-width:1px;transform:rotateX(70deg);animation:tilt 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tilt{to{transform:rotateX(70deg) rotateZ(360deg)}}
.hex{position:absolute;inset:88px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:radial-gradient(circle at 40% 35%,#FFE3EA,#FF3B5C 45%,#4A0C1E 85%);animation:pulse 2.4s ease-in-out infinite;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px}
@keyframes pulse{50%{filter:brightness(1.35) drop-shadow(0 0 22px #FF3B5C);transform:scale(1.06)}}
.sat{position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--y);box-shadow:0 0 14px var(--y)}
.hello{position:absolute;bottom:0;left:0;right:0;text-align:center}
.hello h1{font-size:26px;font-weight:800;letter-spacing:-.3px;opacity:0;animation:rise .8s .3s forwards}
.hello p{margin-top:4px;color:var(--m);font-size:14px;opacity:0;animation:rise .8s .5s forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.word{font-weight:900;font-size:15px;letter-spacing:.5px;text-align:center;margin-bottom:6px}
.word b{color:var(--y)}
/* Karten */
.card{position:relative;margin-top:14px;padding:16px;border-radius:22px;background:var(--glass);border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;transform:translateY(24px) scale(.98);transition:all .6s cubic-bezier(.2,1.1,.3,1)}
.card.in{opacity:1;transform:none}
.card h3{font-size:11px;letter-spacing:3px;color:var(--y);font-weight:800;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.card h3 em{font-style:normal;color:var(--m);letter-spacing:.5px;font-weight:600;text-transform:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;perspective:600px}
.stat{padding:12px 10px;border-radius:16px;background:rgba(255,255,255,.05);text-align:center;transform-style:preserve-3d;animation:wob 5s ease-in-out infinite}
.stat:nth-child(2){animation-delay:-1.6s}.stat:nth-child(3){animation-delay:-3.2s}
@keyframes wob{50%{transform:rotateY(10deg) rotateX(-6deg)}}
.stat b{display:block;font-size:24px;font-weight:900;transform:translateZ(18px)}
.stat small{display:block;margin-top:2px;font-size:10px;color:var(--m);letter-spacing:1px}
.stat i{display:block;font-style:normal;font-size:11px;color:var(--g);margin-top:3px}
.stat.main b{color:var(--y);text-shadow:0 0 18px rgba(255,230,0,.45)}
/* Zeitleiste */
.tl{margin-top:12px;position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:linear-gradient(var(--y),var(--r))}
.ev{position:relative;padding:8px 0 10px}
.ev:before{content:"";position:absolute;left:-20px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--y)}
.ev.now:before{background:var(--y);box-shadow:0 0 0 6px rgba(255,230,0,.2);animation:ping 1.6s infinite}
.ev.done{opacity:.5}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,230,0,.6)}100%{box-shadow:0 0 0 12px rgba(255,230,0,0)}}
.ev b{font-size:15px}.ev span{color:var(--y);font-weight:800;margin-right:8px}
.ev small{display:block;color:var(--m);font-size:12px;margin-top:3px;line-height:1.4}
.empty{color:var(--m);font-size:13px;margin-top:10px;line-height:1.5}
/* Live */
.live{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,45,85,.12);border:1px solid rgba(255,45,85,.35)}
.live .d{width:10px;height:10px;border-radius:50%;background:var(--r);animation:pr 1.4s infinite}
@keyframes pr{0%{box-shadow:0 0 0 0 rgba(255,45,85,.7)}100%{box-shadow:0 0 0 12px rgba(255,45,85,0)}}
.live b{flex:1}
/* Liste */
.li{display:flex;gap:10px;align-items:center;margin-top:10px}
.li .n{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;background:rgba(255,230,0,.14);color:var(--y);flex:none}
.li div{flex:1;font-size:14px;line-height:1.3}.li small{color:var(--m);font-size:12px}
.ring-s{width:34px;height:34px;flex:none}
/* Knöpfe */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{padding:14px 10px;border-radius:16px;border:none;font:inherit;font-weight:800;font-size:14px;color:#111;background:var(--y);
  box-shadow:0 10px 30px rgba(255,230,0,.25);transition:transform .15s}
.btn.alt{background:rgba(255,255,255,.08);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.1)}
.btn:active{transform:scale(.95)}
.foot{text-align:center;color:var(--m);font-size:11px;margin-top:18px}
/* Chat-Leiste */
.wrap{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.chat{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(11,11,15,0),rgba(11,11,15,.96) 22%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.chat .in{max-width:520px;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff}
.chip:active{transform:scale(.94);background:rgba(255,230,0,.2)}
.bar{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 16px;border-radius:999px;background:rgba(30,26,40,.85);
  border:1px solid rgba(255,230,0,.35);box-shadow:0 0 0 0 rgba(255,230,0,.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:box-shadow .3s}
.bar:focus-within{box-shadow:0 0 0 4px rgba(255,230,0,.18),0 10px 40px rgba(255,230,0,.2)}
.bar input{flex:1;min-width:0;background:none;border:none;outline:none;color:#fff;font:inherit;font-size:16px}
.bar input::placeholder{color:var(--m)}
.bar button{width:42px;height:42px;border-radius:50%;border:none;background:var(--y);color:#111;font-size:18px;font-weight:900;transition:transform .15s}
.bar button:active{transform:scale(.88) rotate(-20deg)}
.toast{position:fixed;left:50%;bottom:140px;transform:translate(-50%,20px);opacity:0;z-index:6;padding:10px 16px;border-radius:14px;
  background:rgba(125,255,176,.15);border:1px solid rgba(125,255,176,.5);font-size:14px;font-weight:700;transition:all .35s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* tippbare Zeilen */
.tap{cursor:pointer;border-radius:12px;transition:background .2s,transform .15s;padding:4px 6px;margin-left:-6px;margin-right:-6px}
.tap:active{transform:scale(.97);background:rgba(255,230,0,.1)}
.tap .go{color:var(--y);font-weight:900;font-size:18px;flex:none}
.mini{padding:7px 10px;border-radius:10px;border:none;font:inherit;font-size:12px;font-weight:800;background:var(--y);color:#111;flex:none}
.mini.stop{background:rgba(255,255,255,.12);color:#fff}
.pill{display:inline-block;margin-top:8px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(92,225,255,.12);color:var(--c);border:1px solid rgba(92,225,255,.3)}
.btns{grid-template-columns:1fr 1fr}
/* Einkaufsliste */
.tabs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;transition:all .25s}
.tab b{margin-left:6px;color:var(--m);font-weight:700}
.tab.on{background:var(--y);color:#111;box-shadow:0 6px 22px rgba(255,230,0,.3)}.tab.on b{color:#111}
.shop{margin-top:10px}
.it{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.06);transition:opacity .35s,transform .35s;animation:pop .45s both}
@keyframes pop{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.it .cb{width:24px;height:24px;border-radius:8px;border:2px solid rgba(255,230,0,.6);flex:none;display:flex;align-items:center;justify-content:center;transition:all .25s}
.it.done .cb{background:var(--g);border-color:var(--g);transform:scale(1.1)}
.it.done .cb:after{content:"✓";color:#111;font-weight:900;font-size:14px}
.it .nm{flex:1;font-size:15px;transition:color .3s}
.it.done .nm{color:var(--m);text-decoration:line-through}
.it .q{color:var(--y);font-weight:800;margin-right:6px}
.it .pr{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}.it .pr i{font-style:normal;color:var(--m);font-weight:600;font-size:11px;margin-right:3px}
.sum{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px 14px;border-radius:16px;background:rgba(255,230,0,.08);border:1px solid rgba(255,230,0,.25)}
.sum small{color:var(--m);font-size:12px;display:block}.sum b{font-size:22px;font-weight:900;color:var(--y);font-variant-numeric:tabular-nums}
.bar2{height:6px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--y));transition:width .5s}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <div class="word">peak<b>Z</b>eit · JARVIS</div>
  <div class="hero" style="height:320px">
    <div class="core"><div class="ring r4"></div><div class="ring r1"></div><div class="ring r2"><div class="sat"></div></div><div class="ring r3"></div><div class="hex">J</div></div>
    <div class="hello"><h1 id="hello">Hallo, Boss.</h1><p id="sub"></p><span class="pill" id="ruhe" style="display:none"></span></div>
  </div>

  <div class="card" id="c_stats"><h3>Kanal <em id="handle"></em></h3>
    <div class="stats">
      <div class="stat main"><b data-n="followers">–</b><small>FOLLOWER</small><i id="f_day"></i></div>
      <div class="stat"><b data-n="likes">–</b><small>LIKES</small><i id="l_day"></i></div>
      <div class="stat"><b data-n="videos">–</b><small>VIDEOS</small><i></i></div>
    </div></div>

  <div class="card" id="c_live" style="display:none"><h3>Gerade live</h3><div id="lives"></div></div>

  <div class="card" id="c_plan"><h3>Heute posten <em id="plan_n"></em></h3><div class="tl" id="plan"></div></div>

  <div class="card" id="c_shop"><h3>Einkaufsliste <em id="shop_tot"></em></h3>
    <div class="tabs" id="tabs"></div><div class="shop" id="shop"></div>
    <div class="bar2"><i id="shop_prog"></i></div>
    <div class="sum"><div><small id="shop_lbl">Noch zu kaufen</small><b id="shop_sum">0,00 €</b></div><button class="mini" id="shop_done" style="display:none">✓ Einkauf fertig</button></div>
  </div>

  <div class="card" id="c_agenda"><h3>Termine &amp; Aufgaben</h3><div class="tl" id="agenda"></div></div>

  <div class="card" id="c_clips"><h3>Letzte Clips <em>antippen = aufs Handy</em></h3><div id="clips"></div></div>

  <div class="card" id="c_radar"><h3>Konkurrenz-Radar</h3><div id="radar"></div></div>

  <div class="btns">
    <button class="btn" data-cmd="clips">🎬 Clips schicken</button>
    <button class="btn" data-cmd="plan">🗓 Woche planen</button>
    <button class="btn alt" data-cmd="heute_senden">📲 Heutige Videos</button>
    <button class="btn alt" data-cmd="live">🔴 Live prüfen</button>
    <button class="btn alt" data-cmd="recycling">♻️ Recycling</button>
    <button class="btn alt" data-cmd="sound">🎵 Trend-Sounds</button>
    <button class="btn alt" data-cmd="radar">📡 Radar</button>
    <button class="btn alt" data-cmd="morgen">☀️ Morgen-Karte</button>
  </div>
  <div class="foot" id="foot">Daten kommen direkt von deinem Jarvis – nichts davon liegt auf dieser Webseite.</div>
</div>
<div class="toast" id="toast"></div>
<div class="chat"><div class="in">
  <div class="chips" id="chips"></div>
  <form class="bar" id="bar"><input id="q" placeholder="Frag Jarvis …" autocomplete="off" enterkeyhint="send"><button type="submit">➤</button></form>
</div></div>
<script>
const tg = window.Telegram && Telegram.WebApp; if (tg){ tg.ready(); tg.expand(); try { tg.setHeaderColor("#0B0B0F"); tg.setBackgroundColor("#0B0B0F"); } catch (e) {} }
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n == null ? "–" : n >= 1e6 ? (n/1e6).toFixed(1).replace(".", ",") + " Mio" : n >= 1e4 ? (n/1e3).toFixed(1).replace(".", ",") + "K" : Number(n).toLocaleString("de-DE");
function decode(){ try { const h = location.hash.replace(/^#/, ""); const p = new URLSearchParams(h).get("d"); if (!p) return null;
  const b = atob(p.replace(/-/g, "+").replace(/_/g, "/")); const bytes = Uint8Array.from(b, c => c.charCodeAt(0)); return JSON.parse(new TextDecoder().decode(bytes)); } catch (e) { return null; } }
const D = decode() || {hello: "Hallo, Boss.", sub: "Öffne die App über den Knopf im Jarvis-Chat, dann sind deine Daten da.", demo: true};

function countUp(el, to){ if (to == null){ el.textContent = "–"; return; } const t0 = performance.now(), dur = 1400;
  (function step(t){ const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(Math.round(to * e)); if (p < 1) requestAnimationFrame(step); })(t0); }
function ring(score){ const s = Math.max(0, Math.min(10, score || 0)), col = s >= 8 ? "#7DFFB0" : s >= 6 ? "#FFE600" : "#FF8FA3", c = 2 * Math.PI * 14;
  return `<svg class="ring-s" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"/>
    <circle cx="17" cy="17" r="14" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 17 17)">
    <animate attributeName="stroke-dashoffset" to="${c * (1 - s / 10)}" dur="1.2s" fill="freeze" begin="0.4s"/></circle>
    <text x="17" y="21" text-anchor="middle" fill="#fff" font-size="11" font-weight="800">${s.toFixed(0)}</text></svg>`; }

$("hello").textContent = D.hello || "Hallo, Boss."; $("sub").textContent = D.sub || "";
const k = D.kanal || {}; $("handle").textContent = k.handle ? "@" + k.handle : "nicht verbunden";
document.querySelectorAll("[data-n]").forEach(el => countUp(el, k[el.dataset.n]));
$("f_day").textContent = k.f_day != null ? `+${fmt(Math.max(0, k.f_day))} heute` : ""; $("l_day").textContent = k.l_day != null ? `+${fmt(Math.max(0, k.l_day))} heute` : "";
const nowHM = new Date().toTimeString().slice(0, 5);
const plan = D.plan || []; $("plan_n").textContent = plan.length ? plan.length + " Posts" : "";
let nextMarked = false;
$("plan").innerHTML = plan.length ? plan.map(p => { const done = p.t < nowHM, now = !done && !nextMarked; if (now) nextMarked = true;
  return `<div class="ev ${done ? "done" : ""} ${now ? "now" : ""}"><b><span>${esc(p.t)}</span>${esc(p.title)}</b>
    <small>${p.caption ? "💬 " + esc(p.caption) + "<br>" : ""}${esc((p.tags || []).join(" "))}${p.sound ? "<br>🎵 " + esc(p.sound) : ""}</small></div>`; }).join("")
  : `<div class="empty">Für heute ist nichts geplant – tipp unten auf „Woche planen“.</div>`;
const ag = D.agenda || [];
$("agenda").innerHTML = ag.length ? ag.map(a => `<div class="ev ${a.t && a.t < nowHM ? "done" : ""}"><b>${a.t ? `<span>${esc(a.t)}</span>` : ""}${esc(a.x)}</b></div>`).join("")
  : `<div class="empty">Keine Termine oder Aufgaben für heute.</div>`;
const lives = D.live || []; if (lives.length){ $("c_live").style.display = "";
  $("lives").innerHTML = lives.map((l, i) => `<div class="live"><span class="d"></span><b>${esc(l.name)}</b><small>${esc(l.p)}</small>${l.rec ? `<button class="mini stop" data-rec="/stopp">⏹ Stopp</button>` : `<button class="mini" data-rec="/mitschneiden ${i}">✂️ Mitschneiden</button>`}</div>`).join(""); }
const clips = D.clips || [];
$("clips").innerHTML = clips.length ? clips.map((c, i) => `<div class="li tap" data-clip="${esc(c.title)}">${c.s != null ? ring(c.s) : `<span class="n">${i + 1}</span>`}<div>${esc(c.title)}<br><small>${esc(c.who || "")} · ${esc(c.when || "")}</small></div><span class="go">↓</span></div>`).join("")
  : `<div class="empty">Noch keine fertigen Clips.</div>`;
const rad = D.radar || [];
$("radar").innerHTML = rad.length ? rad.map(r => `<div class="li"><span class="n">@</span><div>@${esc(r.h)}<br><small>${fmt(r.f)} Follower · +${fmt(Math.max(0, r.w || 0))} / Woche${r.top ? " · Top: " + esc(r.top) : ""}</small></div></div>`).join("")
  : `<div class="empty">Noch kein Kanal im Radar – im Chat: „Beobachte @kanal“.</div>`;
if (D.ts) $("foot").textContent = "Stand " + D.ts + " · Daten kommen direkt von deinem Jarvis – nichts davon liegt auf dieser Webseite.";
// Karten nacheinander einfliegen
document.querySelectorAll(".card").forEach((c, i) => setTimeout(() => c.classList.add("in"), 250 + i * 140));
// Senden an Jarvis: aus dem Tastatur-Knopf direkt (sendData), sonst per Link in den Chat
function b64u(t){ const b = new TextEncoder().encode(t); let x = ""; b.forEach(c => x += String.fromCharCode(c)); return btoa(x).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function haptic(k){ try { tg && tg.HapticFeedback && (k === "ok" ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred(k || "medium")); } catch (e) {} }
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1800); }
function send(text){
  text = String(text || "").trim(); if (!text) return; haptic("ok");
  if (tg && !tg.initData && tg.sendData){ toast("✓ an Jarvis geschickt"); setTimeout(() => tg.sendData(text), 350); return; }
  const bot = D.bot; if (!tg || !bot){ toast("Öffne die App im Jarvis-Chat"); return; }
  let start;
  if (/^\/[a-z_]+$/.test(text)) start = text.slice(1);
  else if (new TextEncoder().encode(text).length <= 46) start = "q" + b64u(text);
  else { try { navigator.clipboard && navigator.clipboard.writeText(text); } catch (e) {} toast("Zu lang – Text kopiert, einfügen & senden"); start = ""; }
  toast("✓ an Jarvis geschickt");
  setTimeout(() => { tg.openTelegramLink(`https://t.me/${bot}` + (start ? `?start=${start}` : "")); setTimeout(() => tg.close(), 300); }, 300);
}
document.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => send("/" + b.dataset.cmd));
const CHIPS = ["Wie weit bist du?", "Was poste ich heute?", "🛒 Auf die Liste …", "Neue Follower?", "Wer ist live?",
  ...(rad[0] ? [`Clips vom neuesten Video von ${rad[0].h}`.slice(0, 46)] : []), "Plane meine Woche", "Stopp"];
$("chips").innerHTML = CHIPS.map(c => `<button class="chip">${esc(c)}</button>`).join("");
$("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => {
  if (b.textContent.startsWith("🛒")){ const st = (SH.stores[shopTab] || {}).n || "Lidl"; const q = $("q"); q.value = ` auf die ${st}-Liste`; q.focus();
    try { q.setSelectionRange(0, 0); } catch (e) {} haptic("light"); return; }
  send(b.textContent); });
$("bar").onsubmit = e => { e.preventDefault(); const v = $("q").value; $("q").value = ""; $("q").blur(); send(v); };
// Clips antippen = aufs Handy schicken, Live = mitschneiden
document.querySelectorAll("[data-clip]").forEach(el => el.onclick = () => send(("/clip " + el.dataset.clip).slice(0, 46)));
document.querySelectorAll("[data-rec]").forEach(el => el.onclick = e => { e.stopPropagation(); send(el.dataset.rec); });
// Einkaufsliste: abhaken bleibt in der App gespeichert (Telegram-Cloud), „Einkauf fertig“ meldet es Jarvis
const SH = D.shop || {stores: []}; const eur = v => (v || 0).toLocaleString("de-DE", {style: "currency", currency: "EUR"});
let shopTab = 0, done = {};
const CS = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") ? tg.CloudStorage : null;
function saveDone(){ const v = JSON.stringify(done); try { localStorage.setItem("pz_done", v); } catch (e) {} if (CS) CS.setItem("pz_done", v); }
function renderShop(){
  if (!SH.stores.length){ $("tabs").innerHTML = ""; $("shop").innerHTML = `<div class="empty">Leer. Schreib unten z. B. „Milch und Eier auf die Lidl-Liste“.</div>`;
    $("shop_sum").textContent = eur(0); return; }
  $("shop_tot").textContent = "gesamt " + eur(SH.total);
  $("tabs").innerHTML = SH.stores.map((s, i) => `<button class="tab ${i === shopTab ? "on" : ""}" data-t="${i}">${esc(s.n)}<b>${s.items.length}</b></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { haptic("light"); shopTab = +b.dataset.t; renderShop(); });
  const st = SH.stores[shopTab];
  $("shop").innerHTML = st.items.map((it, k) => `<div class="it ${done[it.i] ? "done" : ""}" data-i="${it.i}" style="animation-delay:${k * 45}ms">
    <span class="cb"></span><span class="nm">${it.q ? `<span class="q">${esc(it.q)}</span>` : ""}${esc(it.x)}</span>
    <span class="pr">${it.p != null ? (it.e ? "<i>ca.</i>" : "") + eur(it.p) : "<i>…</i>"}</span></div>`).join("");
  $("shop").querySelectorAll(".it").forEach(el => el.onclick = () => { const id = el.dataset.i; done[id] = !done[id]; if (!done[id]) delete done[id];
    haptic(done[id] ? "ok" : "light"); el.classList.toggle("done", !!done[id]); saveDone(); sums(); });
  sums();
}
function sums(){ const st = SH.stores[shopTab]; if (!st) return;
  const open = st.items.filter(i => !done[i.i]), left = open.reduce((a, i) => a + (i.p || 0), 0), n = st.items.length - open.length;
  countTo($("shop_sum"), left); $("shop_prog").style.width = (st.items.length ? n / st.items.length * 100 : 0) + "%";
  $("shop_lbl").textContent = n ? `Noch zu kaufen · ${n}/${st.items.length} im Wagen` : `Noch zu kaufen bei ${st.n}`;
  $("shop_done").style.display = n ? "" : "none"; }
let sumNow = 0; function countTo(el, to){ const from = sumNow, t0 = performance.now(); sumNow = to;
  (function f(t){ const p = Math.min(1, (t - t0) / 450); el.textContent = eur(from + (to - from) * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); })(t0); }
$("shop_done").onclick = () => { const st = SH.stores[shopTab]; const ids = st.items.filter(i => done[i.i]).map(i => i.i);
  const all = ids.length === st.items.length; ids.forEach(i => delete done[i]); saveDone();
  send(`/einkauf_fertig ${st.n} ${all ? "alle" : ids.join(",")}`); };
try { done = JSON.parse(localStorage.getItem("pz_done") || "{}"); } catch (e) {}
renderShop();
if (CS) CS.getItem("pz_done", (e, v) => { if (!e && v){ try { done = JSON.parse(v) || {}; renderShop(); } catch (x) {} } });
if (D.ruhe){ $("ruhe").style.display = ""; $("ruhe").textContent = "🌙 Ruhezeit " + D.ruhe + " · Dringendes kommt trotzdem"; }
// Hintergrund: Sterne + Lichtpunkte
const cv = $("bg"), cx = cv.getContext("2d"); let W, H, P = [];
function size(){ W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; } size(); addEventListener("resize", size);
for (let i = 0; i < 90; i++) P.push({x: Math.random(), y: Math.random(), s: Math.random() * 1.8 + .4, v: Math.random() * .0007 + .0002, h: Math.random() < .2});
(function loop(t){ cx.clearRect(0, 0, W, H);
  const g = cx.createRadialGradient(W * .2, H * .05, 0, W * .2, H * .05, W * 1.1); g.addColorStop(0, "rgba(255,230,0,.13)"); g.addColorStop(1, "rgba(0,0,0,0)"); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  const g2 = cx.createRadialGradient(W * .9, H * .9, 0, W * .9, H * .9, W); g2.addColorStop(0, "rgba(255,45,85,.14)"); g2.addColorStop(1, "rgba(0,0,0,0)"); cx.fillStyle = g2; cx.fillRect(0, 0, W, H);
  P.forEach(p => { p.y -= p.v; if (p.y < 0) p.y = 1; cx.fillStyle = p.h ? "rgba(255,230,0,.8)" : "rgba(220,210,230,.45)"; cx.beginPath(); cx.arc(p.x * W, p.y * H, p.s * devicePixelRatio, 0, 6.3); cx.fill(); });
  requestAnimationFrame(loop); })();
</script>
